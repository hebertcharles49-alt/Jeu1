name: Release Windows Installer

on:
  push:
    tags:
      - "v*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-installer:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - name: Setup MSYS2 + MinGW + SDL2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-SDL2
            mingw-w64-x86_64-pkg-config
            make

      - name: Build game
        run: make

      - name: Copy SDL2.dll next to exe
        run: cp /mingw64/bin/SDL2.dll SDL2.dll

      - name: Install Inno Setup
        shell: powershell
        run: |
          choco install innosetup --no-progress -y

      - name: Compile installer
        shell: cmd
        run: |
          "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\element_dungeon.iss

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: ElementDungeon-Setup
          path: installer/out/ElementDungeon-Setup-*.exe

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: installer/out/ElementDungeon-Setup-*.exe
          generate_release_notes: true
