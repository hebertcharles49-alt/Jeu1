# Element Dungeon - exemple de fichier mod
#
# Place tes fichiers .cfg dans le dossier mods/ et ils seront
# charges au demarrage du jeu. Format simple : une cle par ligne.
#   key = value
# Lignes vides et lignes qui commencent par # sont ignorees.
#
# Le code consulte ces cles via mod_get_int/float/string. Au fur
# et a mesure que de nouvelles cles seront supportees par le jeu,
# elles seront listees ici a titre d'exemple.

# Exemple de surcharge de constantes :
starting_hp = 120
starting_speed = 130
elite_chance_per_floor = 0.07

# Couleur d'ambiance d'un boss (RGB hex 0xRRGGBB) :
boss_color = 0xFF8030

# Texte du tutoriel (a venir) :
intro_message = "Bienvenue, aventurier."
